services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cordia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cordia
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: Cordia_Agent
      POSTGRES_INITDB_ARGS: "--locale=en_US.utf8"
    ports:
      - "5432:5432"
    command: -c max_connections=500
    volumes:
      - cordia-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cordia -d Cordia_Agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cordia-pgdata:
