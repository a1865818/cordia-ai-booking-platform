name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.title, '@claude') ||
         contains(github.event.issue.body, '@claude') ||
         (github.event.action == 'labeled' && github.event.label.name == 'claude'))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-4-8
            --effort xhigh
            --allowedTools "mcp__github__create_issue,mcp__github__get_issue,mcp__github__search_issues,mcp__github__list_issues,mcp__github__update_issue,Bash(gh issue create:*),Bash(gh issue view:*),Bash(gh search issues:*),Bash(gh api:*),Bash(gh label create:*)"

          additional_permissions: |
            actions: read
            issues: write
