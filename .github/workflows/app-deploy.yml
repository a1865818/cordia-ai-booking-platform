# Cordia — App Service Deploy
#
# Deploys a pre-built Docker image (the combined api + web bundle) from ACR to a
# target App Service, then configures app settings.
#
# Triggered by:
#   - workflow_dispatch (manual)
#   - repository_dispatch type: app-deploy (automation)
#
# Auth sequence:
#   1. Login to the primary (home) Azure tenant via OIDC.
#   2. (Optional) For cross-tenant deploys, retrieve a service principal and
#      `az login --service-principal` to switch into the target tenant.
#
# Required GitHub Secrets (per environment):
#   AZURE_CLIENT_ID          — Azure OIDC federated credential client ID  # TODO(cordia)
#   AZURE_TENANT_ID          — Azure tenant ID                            # TODO(cordia)
#   AZURE_SUBSCRIPTION_ID    — Azure subscription ID                      # TODO(cordia)
#
# Required GitHub Variables:
#   CONTAINER_REGISTRY_SERVER — ACR login server hostname  # TODO(cordia)

name: App Service Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, tst, pre, prd]
      release-code:
        description: 'Release code (image tag)'
        required: true
        type: string
      app-service-name:
        description: 'App Service name'
        required: true
        type: string
      resource-group-name:
        description: 'Resource group name'
        required: true
        type: string
      key-vault-name:
        description: 'Environment Key Vault name'
        required: false
        type: string
      shared-key-vault-name:
        description: 'Shared Key Vault name'
        required: false
        type: string
      pipeline-run-guid:
        description: 'Automation pipeline run GUID (optional)'
        required: false
        type: string
      tenant-id:
        description: 'Target Azure tenant ID (cross-tenant deploys only)'
        required: false
        type: string
      subscription-id:
        description: 'Target subscription ID (cross-tenant deploys only)'
        required: false
        type: string

  repository_dispatch:
    types: [app-deploy]

permissions:
  id-token: write
  contents: read

jobs:
  resolve-inputs:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.r.outputs.environment }}
      release-code: ${{ steps.r.outputs.release-code }}
      app-service-name: ${{ steps.r.outputs.app-service-name }}
      resource-group-name: ${{ steps.r.outputs.resource-group-name }}
      key-vault-name: ${{ steps.r.outputs.key-vault-name }}
      shared-key-vault-name: ${{ steps.r.outputs.shared-key-vault-name }}
      pipeline-run-guid: ${{ steps.r.outputs.pipeline-run-guid }}
      tenant-id: ${{ steps.r.outputs.tenant-id }}
      subscription-id: ${{ steps.r.outputs.subscription-id }}
    steps:
      - name: Resolve inputs
        id: r
        run: |
          # repository_dispatch payload takes precedence, falls back to workflow_dispatch inputs.
          # NOTE: jq bracket notation .["key"] is required for hyphenated keys —
          # .deploy-target would be parsed as subtraction (.deploy minus target).
          resolve() {
            local key="$1" manual="$2"
            local dispatch_val
            dispatch_val=$(echo '${{ toJSON(github.event.client_payload) }}' | jq -r ".[\"${key}\"] // empty")
            echo "${key}=${dispatch_val:-$manual}" >> "$GITHUB_OUTPUT"
          }
          resolve "environment" "${{ inputs.environment }}"
          resolve "release-code" "${{ inputs.release-code }}"
          resolve "app-service-name" "${{ inputs.app-service-name }}"
          resolve "resource-group-name" "${{ inputs.resource-group-name }}"
          resolve "key-vault-name" "${{ inputs.key-vault-name }}"
          resolve "shared-key-vault-name" "${{ inputs.shared-key-vault-name }}"
          resolve "pipeline-run-guid" "${{ inputs.pipeline-run-guid }}"
          resolve "tenant-id" "${{ inputs.tenant-id }}"
          resolve "subscription-id" "${{ inputs.subscription-id }}"

  deploy:
    runs-on: ubuntu-latest
    needs: resolve-inputs
    environment: ${{ needs.resolve-inputs.outputs.environment }}
    steps:
      # ── Validate cross-tenant inputs ──────────────────────────────
      # If tenant-id is provided, subscription-id is also required. Fail fast
      # rather than silently deploying under the wrong tenant context.
      - name: Validate cross-tenant inputs
        run: |
          TENANT_ID="${{ needs.resolve-inputs.outputs.tenant-id }}"
          SUB_ID="${{ needs.resolve-inputs.outputs.subscription-id }}"

          if [ -n "$TENANT_ID" ] && [ -z "$SUB_ID" ]; then
            echo "::error::tenant-id was provided but subscription-id is missing"
            exit 1
          fi
          if [ -z "$TENANT_ID" ] && [ -n "$SUB_ID" ]; then
            echo "::error::subscription-id was provided but tenant-id is missing"
            exit 1
          fi

          if [ -n "$TENANT_ID" ]; then
            echo "Cross-tenant deploy: will switch to tenant $TENANT_ID / subscription $SUB_ID"
          else
            echo "Home-tenant deploy: using repo-level Azure credentials"
          fi

      # ── Auth (Home Tenant) ─────────────────────────────────────────
      # Step 1: Login to the home tenant (needed for any Key Vault access below).
      - name: Azure Login (Home Tenant)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Auth (Target Tenant) ──────────────────────────────────────
      # Step 2 (optional): For cross-tenant deploys, retrieve a target-tenant
      # service principal and switch tenants. After this step az CLI targets the
      # target subscription.
      # TODO(cordia): if you do cross-tenant deploys, wire up retrieval of the
      # target SP credentials (e.g. from a Key Vault or GitHub secrets) below.
      - name: Retrieve SP and Login (Target Tenant)
        if: needs.resolve-inputs.outputs.tenant-id != ''
        env:
          # TODO(cordia): provide these (e.g. from a management Key Vault).
          TARGET_SP_CLIENT_ID: ${{ secrets.TARGET_SP_CLIENT_ID }}
          TARGET_SP_SECRET: ${{ secrets.TARGET_SP_SECRET }}
        run: |
          TENANT_ID="${{ needs.resolve-inputs.outputs.tenant-id }}"

          az login --service-principal \
            -u "$TARGET_SP_CLIENT_ID" \
            -p "$TARGET_SP_SECRET" \
            --tenant "$TENANT_ID"
          az account set --subscription "${{ needs.resolve-inputs.outputs.subscription-id }}"

      # ── Deploy ────────────────────────────────────────────────────
      # NOTE: azure/webapps-deploy@v3 supports `resource-group-name` (not
      # `resource-group`) and does NOT have an `app-settings` input.
      # App settings must be configured via a separate az CLI step.
      - name: Deploy Docker image to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.resolve-inputs.outputs.app-service-name }}
          resource-group-name: ${{ needs.resolve-inputs.outputs.resource-group-name }}
          images: ${{ vars.CONTAINER_REGISTRY_SERVER }}/cordia_api:${{ needs.resolve-inputs.outputs.release-code }}

      - name: Configure App Settings
        run: |
          APP_NAME="${{ needs.resolve-inputs.outputs.app-service-name }}"
          RG="${{ needs.resolve-inputs.outputs.resource-group-name }}"
          ENV="${{ needs.resolve-inputs.outputs.environment }}"
          KV="${{ needs.resolve-inputs.outputs.key-vault-name }}"
          SHARED_KV="${{ needs.resolve-inputs.outputs.shared-key-vault-name }}"

          # TODO(cordia): populate the application settings your API + web bundle needs.
          # Secrets can use @Microsoft.KeyVault(VaultName=${KV};SecretName=...) references —
          # this requires the App Service managed identity to have Key Vault access.
          # Registry pull credentials are shown as an example using the shared vault.
          az webapp config appsettings set \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --settings \
              "Version=${{ github.run_id }}" \
              "WEBSITES_PORT=8080" \
              "ASPNETCORE_FORWARDEDHEADERS_ENABLED=true" \
              "Cordia__EnvironmentCode=${ENV}" \
              "Cordia__ReleaseCode=${{ needs.resolve-inputs.outputs.release-code }}"
              # TODO(cordia): add registry pull creds + app secrets, e.g.
              #   "DOCKER_REGISTRY_SERVER_URL=@Microsoft.KeyVault(VaultName=${SHARED_KV};SecretName=AzureContainerRegistryEndpoint)" \
              #   "DOCKER_REGISTRY_SERVER_USERNAME=@Microsoft.KeyVault(VaultName=${SHARED_KV};SecretName=AzureContainerRegistryUser)" \
              #   "DOCKER_REGISTRY_SERVER_PASSWORD=@Microsoft.KeyVault(VaultName=${SHARED_KV};SecretName=AzureContainerRegistryPassword)"

      - name: Azure Logout
        if: always()
        run: az logout
