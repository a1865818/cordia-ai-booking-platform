# Cordia CI/CD
#
# Required GitHub Repository Variables:
#   ENVIRONMENT                 — Deployment environment slug (per-environment, e.g. dev/test/prd)
#   CONTAINER_REGISTRY_SERVER   — ACR login server hostname (per-environment)  # TODO(cordia): set ACR hostname, e.g. <name>.azurecr.io
#   CONTAINER_REGISTRY_NAME     — ACR admin username (per-environment)         # TODO(cordia): set ACR admin user
#   AZURE_ACR_NAME              — ACR resource name (for Container App registry config)  # TODO(cordia)
#   AZURE_RESOURCE_GROUP        — Resource group containing the Container App + App Service  # TODO(cordia)
#   AZURE_CONTAINER_APP_NAME    — Container App name for the langgraph deploy  # TODO(cordia)
#   AZURE_APP_SERVICE_NAME      — App Service name for the api/web deploy       # TODO(cordia)
#   WEB_BASE_PATH               — (optional) Front Door / reverse-proxy path prefix for the web SPA
#
# Required GitHub Secrets:
#   AZURE_CLIENT_ID             — Azure OIDC federated credential client ID  # TODO(cordia)
#   AZURE_TENANT_ID             — Azure tenant ID                            # TODO(cordia)
#   AZURE_SUBSCRIPTION_ID       — Azure subscription ID                      # TODO(cordia)
#   CONTAINER_REGISTRY_PASSWORD — ACR admin password / pull token            # TODO(cordia)

name: CI/CD

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force-all:
        description: "Build and deploy all apps (bypass NX affected detection)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  id-token: write
  contents: read
  packages: read
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Detect Affected — determine which projects need CI
  # ──────────────────────────────────────────────────────────────────────────────
  detect-affected:
    runs-on: ubuntu-latest
    outputs:
      langgraph-affected: ${{ steps.affected.outputs.langgraph }}
      api-affected: ${{ steps.affected.outputs.api }}
      web-affected: ${{ steps.affected.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NX SHA detection — base/head SHAs for `nx affected`
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install NX workspace dependencies
        run: bun install --frozen-lockfile

      - name: Detect affected apps
        id: affected
        run: |
          if [[ "${{ inputs.force-all }}" == "true" ]]; then
            echo "Force-all enabled — marking all apps as affected"
            echo "langgraph=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            AFFECTED=$(bun nx show projects --affected --type=app)
            echo "langgraph=$(echo "$AFFECTED" | grep -qx 'langgraph' && echo true || echo false)" >> "$GITHUB_OUTPUT"

            API_AFFECTED=$(echo "$AFFECTED" | grep -qx 'api' && echo true || echo false)
            WEB_AFFECTED=$(echo "$AFFECTED" | grep -qx 'web' && echo true || echo false)

            # On the integration branch the combined Docker image needs both API and web builds,
            # so force both affected whenever either is affected.
            BRANCH="${GITHUB_REF_NAME}"
            if [[ ("$API_AFFECTED" == "true" || "$WEB_AFFECTED" == "true") && "$BRANCH" == "main" ]]; then
              API_AFFECTED=true
              WEB_AFFECTED=true
            fi

            echo "api=$API_AFFECTED" >> "$GITHUB_OUTPUT"
            echo "web=$WEB_AFFECTED" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────────────────────
  # Generate Shared Artifacts — shared schemas + REST API contract
  # ──────────────────────────────────────────────────────────────────────────────
  generate-schemas:
    runs-on: ubuntu-latest
    needs: detect-affected
    if: >-
      needs.detect-affected.outputs.langgraph-affected == 'true' ||
      needs.detect-affected.outputs.api-affected == 'true' ||
      needs.detect-affected.outputs.web-affected == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest

      # ── Caching ───────────────────────────────────────────────────────────────
      - name: Cache UV
        uses: actions/cache@v4
        with:
          path: |
            apps/langgraph/.venv
            ~/.cache/uv
          key: uv-generate-schemas-${{ runner.os }}-${{ hashFiles('apps/langgraph/uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            uv-generate-schemas-${{ runner.os }}-${{ hashFiles('apps/langgraph/uv.lock') }}-
            uv-generate-schemas-${{ runner.os }}-
            uv-${{ runner.os }}-${{ hashFiles('apps/langgraph/uv.lock') }}-
            uv-${{ runner.os }}-

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-generate-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj', 'apps/api/**/*.sln') }}-${{ github.run_id }}
          restore-keys: |
            nuget-generate-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj', 'apps/api/**/*.sln') }}-
            nuget-generate-${{ runner.os }}-

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install NX workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Python dependencies
        run: bun nx run langgraph:sync

      # ── Generate ──────────────────────────────────────────────────────────────
      - name: Generate shared schemas and API contract
        run: |
          bun nx run shared-schemas:generate-types
          bun nx run api-contract:generate-types

      # ── Drift Checks ─────────────────────────────────────────────────────────
      - name: Check for uncommitted generated artifact changes
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref != 'refs/heads/main')
        run: |
          if [ -n "$(git status --porcelain libs/shared-schemas/ libs/api-contract/)" ]; then
            echo "::error::Generated artifact drift detected — committed shared schemas or API contract outputs are stale."
            echo "::error::Run the generation pipeline locally and commit the results."
            git diff -- libs/shared-schemas/ libs/api-contract/
            exit 1
          fi

      # ── Upload ────────────────────────────────────────────────────────────────
      - name: Upload shared schemas artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-schemas
          path: libs/shared-schemas/
          retention-days: 1

      - name: Upload API contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-contract
          path: libs/api-contract/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────────
  # CI — Python (LangGraph) — runs in parallel with ci-dotnet
  # ──────────────────────────────────────────────────────────────────────────────
  ci-python:
    runs-on: ubuntu-latest
    needs: detect-affected
    if: needs.detect-affected.outputs.langgraph-affected == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest

      # ── Caching ───────────────────────────────────────────────────────────────
      - name: Cache UV
        uses: actions/cache@v4
        with:
          path: |
            apps/langgraph/.venv
            ~/.cache/uv
          key: uv-ci-python-${{ runner.os }}-${{ hashFiles('apps/langgraph/uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            uv-ci-python-${{ runner.os }}-${{ hashFiles('apps/langgraph/uv.lock') }}-
            uv-ci-python-${{ runner.os }}-
            uv-${{ runner.os }}-${{ hashFiles('apps/langgraph/uv.lock') }}-
            uv-${{ runner.os }}-

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install NX workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Python dependencies
        run: bun nx run langgraph:sync

      # ── Lint ──────────────────────────────────────────────────────────────────
      - name: Lint
        run: bun nx run langgraph:lint

      # ── Test ──────────────────────────────────────────────────────────────────
      - name: Test with coverage
        run: bun nx run langgraph:test-coverage

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build
        run: bun nx run langgraph:build

  # ──────────────────────────────────────────────────────────────────────────────
  # CI — .NET (API) — waits only for generate-schemas, not full ci-python
  # ──────────────────────────────────────────────────────────────────────────────
  ci-dotnet:
    runs-on: ubuntu-latest
    needs: [detect-affected, generate-schemas]
    if: >-
      always() && !cancelled() &&
      needs.detect-affected.outputs.api-affected == 'true' &&
      needs.generate-schemas.result != 'failure'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Download freshly generated schemas from generate-schemas if it ran.
      # When generate-schemas was skipped (only API affected), the committed
      # schemas already in the checkout are used.
      - name: Download shared schemas
        if: needs.generate-schemas.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: shared-schemas
          path: libs/shared-schemas/

      # ── Caching ───────────────────────────────────────────────────────────────
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj', 'apps/api/**/*.sln') }}-${{ github.run_id }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj', 'apps/api/**/*.sln') }}-
            nuget-${{ runner.os }}-

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install NX workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install .NET dependencies
        run: bun nx run api:install

      # ── Lint ──────────────────────────────────────────────────────────────────
      - name: Lint
        run: bun nx run api:lint

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build
        run: bun nx run api:build

      # ── Test ──────────────────────────────────────────────────────────────────
      - name: Test
        run: bun nx run api:test

      # ── Package ───────────────────────────────────────────────────────────────
      - name: Package
        run: bun nx run api:package

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload API package
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: apps/api/api.zip
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────────
  # CI — .NET integration suite (Alba + real Postgres)
  #
  # Separate from ci-dotnet because it needs a database and ci-dotnet does not.
  # Postgres comes from the repo's own docker-compose.yml rather than a `services:`
  # block, deliberately: the three test fixtures hardcode
  #   Host=localhost;Port=5432;Username=cordia;Password=localdev
  # as `const` strings (26 call sites for PostgresFixture.TestConnStr alone), and
  # compose already declares exactly that, plus `-c max_connections=500` and the
  # init scripts. Reusing it keeps CI and local dev on one source of truth instead
  # of a second copy of the same credentials that can drift.
  #
  # This is a real gate, not continue-on-error. It only became one once the
  # first-run migration race was fixed (see TestSchemaLock): three fixtures used to
  # migrate an empty database concurrently and lose on 42P07, which fires on every
  # CI run because CI always starts from a fresh database.
  # ──────────────────────────────────────────────────────────────────────────────
  ci-dotnet-integration:
    runs-on: ubuntu-latest
    needs: [detect-affected, generate-schemas]
    if: >-
      always() && !cancelled() &&
      needs.detect-affected.outputs.api-affected == 'true' &&
      needs.generate-schemas.result != 'failure'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Download shared schemas
        if: needs.generate-schemas.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: shared-schemas
          path: libs/shared-schemas/

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj', 'apps/api/**/*.sln') }}-${{ github.run_id }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ hashFiles('apps/api/**/*.csproj', 'apps/api/**/*.sln') }}-
            nuget-${{ runner.os }}-

      # ── Database ──────────────────────────────────────────────────────────────
      - name: Start Postgres
        run: |
          docker compose up -d postgres
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' cordia-postgres 2>/dev/null || echo starting)"
            if [ "$status" = "healthy" ]; then
              echo "postgres healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::postgres did not become healthy within 120s"
          docker compose logs postgres
          exit 1

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install NX workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install .NET dependencies
        run: bun nx run api:install

      # ── Test ──────────────────────────────────────────────────────────────────
      # The fixtures create Cordia_API_Test and apply all migrations themselves,
      # under TestSchemaLock. There is no separate migration step by design: the
      # thing being proved is that the fixtures can do it from scratch.
      - name: Integration tests
        run: bun nx run api:test-integration

      # Exit criterion for Wave 0: the full migration set really did apply to an
      # empty database, rather than the suite passing against a half-built schema.
      - name: Assert the schema was built from scratch
        run: |
          query='select count(*) from "__EFMigrationsHistory";'
          applied="$(docker exec cordia-postgres psql -U cordia -d Cordia_API_Test -t -A -c "$query" | tr -d '[:space:]')"
          echo "migrations applied: $applied"
          if [ "$applied" -lt 39 ]; then
            echo "::error::expected at least 39 migrations applied, found $applied"
            exit 1
          fi

      - name: Postgres logs on failure
        if: failure()
        run: docker compose logs postgres

  # ──────────────────────────────────────────────────────────────────────────────
  # CI — Web (React SPA)
  # ──────────────────────────────────────────────────────────────────────────────
  ci-web:
    runs-on: ubuntu-latest
    needs: [detect-affected, generate-schemas]
    if: >-
      always() && !cancelled() &&
      needs.detect-affected.outputs.web-affected == 'true' &&
      needs.generate-schemas.result != 'failure'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Download freshly generated artifacts from generate-schemas if it ran.
      # When generate-schemas was skipped, the committed files in checkout are used.
      - name: Download shared schemas
        if: needs.generate-schemas.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: shared-schemas
          path: libs/shared-schemas/

      - name: Download API contract
        if: needs.generate-schemas.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: api-contract
          path: libs/api-contract/

      # ── Install ───────────────────────────────────────────────────────────────
      - name: Install NX workspace dependencies
        run: bun install --frozen-lockfile

      # ── Lint ──────────────────────────────────────────────────────────────────
      - name: Lint
        run: bun nx run web:lint

      # ── Type Check ────────────────────────────────────────────────────────────
      - name: Type check
        run: bun nx run web:typecheck

      # ── Test ──────────────────────────────────────────────────────────────────
      # `web:test` (apps/web/project.json) runs Bun's native test runner
      # (`bun test --parallel`), not vitest — see apps/web/CLAUDE.md's Testing section.
      # Requires Bun >= 1.4.0: `--parallel` was flaky (silent false failures) on 1.3.14 and
      # confirmed stable on 1.4.0. `bun-version: latest` above already satisfies this, but
      # don't pin this job below 1.4.0 without re-verifying that finding.
      - name: Test
        run: bun nx run web:test

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build
        env:
          # Must match the reverse-proxy / Front Door path prefix the web SPA is
          # served under. Override per-env via the WEB_BASE_PATH repository variable.
          VITE_BASE_PATH: ${{ vars.WEB_BASE_PATH || '/' }}
        run: bun nx run web:build

      # ── Upload artifacts ──────────────────────────────────────────────────────
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/apps/web/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────────
  # Docker — LangGraph
  # ──────────────────────────────────────────────────────────────────────────────
  docker-langgraph:
    runs-on: ubuntu-latest
    needs: [detect-affected, ci-python]
    if: >-
      github.event_name != 'pull_request' &&
      needs.detect-affected.outputs.langgraph-affected == 'true' &&
      needs.ci-python.result == 'success'
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: astral-sh/setup-uv@v4
        with:
          version: latest

      # Restore UV cache from CI for faster install
      - name: Cache UV
        uses: actions/cache@v4
        with:
          path: |
            apps/langgraph/.venv
            ~/.cache/uv
          key: uv-docker-langgraph-${{ runner.os }}-${{ hashFiles('apps/langgraph/uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            uv-docker-langgraph-${{ runner.os }}-${{ hashFiles('apps/langgraph/uv.lock') }}-
            uv-docker-langgraph-${{ runner.os }}-
            uv-ci-python-${{ runner.os }}-${{ hashFiles('apps/langgraph/uv.lock') }}-
            uv-ci-python-${{ runner.os }}-
            uv-${{ runner.os }}-${{ hashFiles('apps/langgraph/uv.lock') }}-
            uv-${{ runner.os }}-

      - name: Install NX workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install production dependencies
        run: bun nx run langgraph:sync --flags=--no-dev

      - name: Build LangGraph Docker image
        run: bun nx run langgraph:docker-build --tag=${{ vars.CONTAINER_REGISTRY_SERVER }}/cordia_langgraph:${{ vars.ENVIRONMENT }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY_SERVER }}
          username: ${{ vars.CONTAINER_REGISTRY_NAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Push Docker image
        run: docker push ${{ vars.CONTAINER_REGISTRY_SERVER }}/cordia_langgraph:${{ vars.ENVIRONMENT }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Docker — API (combined api + web image)
  # ──────────────────────────────────────────────────────────────────────────────
  docker-api:
    runs-on: ubuntu-latest
    needs: [ci-dotnet, ci-web]
    if: >-
      github.event_name != 'pull_request' &&
      needs.ci-dotnet.result == 'success' &&
      needs.ci-web.result == 'success'
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # Download pre-built api.zip from ci-dotnet
      - name: Download API package
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: apps/api/

      # Download pre-built React SPA from ci-web
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/api/web/

      # Prepare build context: unzip API into dist/ and validate web assets
      - name: Prepare API build context
        working-directory: apps/api
        run: |
          mkdir -p dist
          unzip api.zip -d dist/
          rm api.zip
          if [ ! -f web/index.html ]; then
            echo "::error::web/index.html not found — web build artifact is missing or incomplete"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.CONTAINER_REGISTRY_SERVER }}
          username: ${{ vars.CONTAINER_REGISTRY_NAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/api/
          file: apps/api/Dockerfile
          push: true
          tags: ${{ vars.CONTAINER_REGISTRY_SERVER }}/cordia_api:${{ vars.ENVIRONMENT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy — LangGraph (Azure Container Apps)
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-langgraph:
    runs-on: ubuntu-latest
    needs: docker-langgraph
    if: github.ref_name == 'main'
    environment: ${{ github.ref_name }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # TODO(cordia): Populate the langgraph runtime environment variables your app needs.
      # The reference repo fetched these from Azure Key Vault; replace the placeholders
      # below with your own Key Vault lookups or GitHub secrets/vars as appropriate.
      - name: Prepare environment variables
        id: env-vars
        run: |
          ENV="${{ vars.ENVIRONMENT }}"
          ENV_VARS="VERSION=${{ github.run_id }}"
          ENV_VARS="$ENV_VARS IS_DOCKER=1"
          # TODO(cordia): append app-specific env vars, e.g.
          #   ENV_VARS="$ENV_VARS SOME_SETTING=$SOME_SETTING"
          echo "env-vars=$ENV_VARS" >> "$GITHUB_OUTPUT"

      # Configure the Container App to pull from the ACR using admin user/password
      # (the same credentials used to push). Must run before the deploy below.
      # Secret passed via env to avoid shell-mangling.
      - name: Configure Container App registry credentials
        env:
          REGISTRY_SERVER: ${{ vars.CONTAINER_REGISTRY_SERVER }}
          REGISTRY_USERNAME: ${{ vars.CONTAINER_REGISTRY_NAME }}
          REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
        run: |
          # TODO(cordia): confirm container app name + resource group via the vars below.
          az containerapp registry set \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "$REGISTRY_SERVER" \
            --username "$REGISTRY_USERNAME" \
            --password "$REGISTRY_PASSWORD"

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          # TODO(cordia): confirm container app name + resource group via the vars below.
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ${{ vars.CONTAINER_REGISTRY_SERVER }}/cordia_langgraph:${{ vars.ENVIRONMENT }}

      - name: Set Container App environment variables
        run: |
          # TODO(cordia): the deploy action above does not set arbitrary env vars; apply them here.
          # shellcheck disable=SC2086
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --set-env-vars ${{ steps.env-vars.outputs.env-vars }}

      - name: Azure Logout
        if: always()
        run: az logout

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy — API (Azure App Service)
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-api:
    runs-on: ubuntu-latest
    needs: docker-api
    if: github.ref_name == 'main'
    environment: ${{ github.ref_name }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Set the App Service registry pull credentials BEFORE deploying the image, so the
      # post-deploy restart pulls from the ACR using admin user/password (the same
      # credentials used to push). Secret passed via env to avoid shell-mangling.
      - name: Configure App Service registry credentials
        env:
          REGISTRY_SERVER: ${{ vars.CONTAINER_REGISTRY_SERVER }}
          REGISTRY_USERNAME: ${{ vars.CONTAINER_REGISTRY_NAME }}
          REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
        run: |
          # TODO(cordia): confirm app service name + resource group via the vars below.
          az webapp config appsettings set \
            --name "${{ vars.AZURE_APP_SERVICE_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --settings \
              "DOCKER_REGISTRY_SERVER_URL=https://${REGISTRY_SERVER}" \
              "DOCKER_REGISTRY_SERVER_USERNAME=${REGISTRY_USERNAME}" \
              "DOCKER_REGISTRY_SERVER_PASSWORD=${REGISTRY_PASSWORD}"

      # NOTE: azure/webapps-deploy@v3 uses `resource-group-name` (not `resource-group`)
      # and does NOT support `app-settings` — use az CLI for that.
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_APP_SERVICE_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          images: ${{ vars.CONTAINER_REGISTRY_SERVER }}/cordia_api:${{ vars.ENVIRONMENT }}

      - name: Configure App Settings
        run: |
          ENV="${{ vars.ENVIRONMENT }}"
          # TODO(cordia): populate the application settings your API + web bundle needs.
          # The reference repo wired Auth0 / Databricks / connection strings here from
          # Key Vault; replace with your own settings (literals, secrets, or KV refs).
          az webapp config appsettings set \
            --name "${{ vars.AZURE_APP_SERVICE_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --settings \
              "Version=${{ github.run_id }}" \
              WEBSITES_PORT=8080 \
              ASPNETCORE_FORWARDEDHEADERS_ENABLED=true \
              "Cordia__EnvironmentCode=${ENV}"

      - name: Azure Logout
        if: always()
        run: az logout

  # ──────────────────────────────────────────────────────────────────────────────
  # Release — auto-release on main after CI passes
  # ──────────────────────────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [detect-affected, generate-schemas, ci-python, ci-dotnet, ci-web]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit != null &&
      !contains(github.event.head_commit.message, 'chore(release)') &&
      (needs.detect-affected.outputs.langgraph-affected == 'true' ||
       needs.detect-affected.outputs.api-affected == 'true' ||
       needs.detect-affected.outputs.web-affected == 'true') &&
      needs.generate-schemas.result != 'failure' &&
      needs.ci-python.result != 'failure' &&
      needs.ci-dotnet.result != 'failure' &&
      needs.ci-web.result != 'failure'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install NX workspace dependencies
        run: bun install --frozen-lockfile
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Pull latest (guard against concurrent merges)
        run: git pull --rebase
      - name: Run NX Release
        run: bun nx release --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push release commit and tags
        run: git push --follow-tags
